openapi: 3.0.3
info:
    title: Gereve API
    version: 1.0.0
    description: |
        API de gestão de reservas e eventos.

        Fluxo de uso: cadastre um usuário em `POST /auth/register`, obtenha o token em
        `POST /auth/login` e informe-o no botão **Authorize** para testar as rotas protegidas.
servers:
    - url: http://localhost:3333
      description: Ambiente de desenvolvimento
tags:
    - name: Autenticação
      description: Cadastro, login e dados do usuário autenticado
    - name: Usuários
      description: Administração de usuários, restrita ao papel ADMIN
    - name: Eventos
      description: Criação, consulta e manutenção de eventos
    - name: Reservas
      description: Reservas de vagas em eventos
    - name: Anexos
      description: Envio e download de arquivos vinculados a eventos
    - name: Infraestrutura
      description: Verificação de disponibilidade da API
paths:
    /health:
        get:
            tags: [Infraestrutura]
            summary: Verifica se a API está no ar
            security: []
            responses:
                '200':
                    description: API disponível
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    timestamp:
                                        type: string
                                        format: date-time
    /auth/register:
        post:
            tags: [Autenticação]
            summary: Cadastra um usuário com papel CUSTOMER
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterUserInput'
            responses:
                '201':
                    description: Usuário cadastrado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '409':
                    description: E-mail já cadastrado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error:
                                    code: RESOURCE_ALREADY_EXISTS
                                    message: Já existe um registro com os dados informados
    /auth/login:
        post:
            tags: [Autenticação]
            summary: Autentica o usuário e devolve o token de acesso
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginUserInput'
            responses:
                '200':
                    description: Autenticação bem-sucedida
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResult'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    description: Credenciais inválidas
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error:
                                    code: INVALID_CREDENTIALS
                                    message: E-mail ou senha inválidos
    /auth/me:
        get:
            tags: [Autenticação]
            summary: Devolve o usuário do token informado
            responses:
                '200':
                    description: Usuário autenticado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    description: Usuário do token não existe mais
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error:
                                    code: USER_NOT_FOUND
                                    message: Usuário não encontrado
    /users:
        get:
            tags: [Usuários]
            summary: Lista os usuários cadastrados
            description: Restrito ao papel ADMIN.
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Página de usuários
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, infos]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/User'
                                    infos:
                                        $ref: '#/components/schemas/PaginationInfos'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
    /users/{id}/role:
        patch:
            tags: [Usuários]
            summary: Altera o papel de um usuário
            description: Restrito ao papel ADMIN.
            parameters:
                - $ref: '#/components/parameters/UserId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateUserRoleInput'
            responses:
                '200':
                    description: Papel atualizado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Usuário não encontrado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error:
                                    code: RESOURCE_NOT_FOUND
                                    message: Registro não encontrado
    /events:
        get:
            tags: [Eventos]
            summary: Lista eventos com paginação, filtros e ordenação
            security: []
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
                - name: title
                  in: query
                  description: Trecho do título do evento
                  schema:
                      type: string
                      minLength: 1
                - name: status
                  in: query
                  schema:
                      $ref: '#/components/schemas/EventStatus'
                - name: from
                  in: query
                  description: Data e hora mínima de início, em ISO 8601 com fuso
                  schema:
                      type: string
                      format: date-time
                  example: '2026-10-01T00:00:00-03:00'
                - name: to
                  in: query
                  description: Data e hora máxima de início, em ISO 8601 com fuso
                  schema:
                      type: string
                      format: date-time
                  example: '2026-12-31T23:59:59-03:00'
                - name: organizerId
                  in: query
                  schema:
                      type: string
                      format: uuid
                - name: sort
                  in: query
                  schema:
                      type: string
                      enum: [startsAt, title, createdAt]
                      default: startsAt
                - name: order
                  in: query
                  schema:
                      type: string
                      enum: [asc, desc]
                      default: asc
            responses:
                '200':
                    description: Página de eventos
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, infos]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Event'
                                    infos:
                                        $ref: '#/components/schemas/PaginationInfos'
                '400':
                    $ref: '#/components/responses/ValidationError'
        post:
            tags: [Eventos]
            summary: Cria um evento
            description: Restrito aos papéis ORGANIZER e ADMIN. O evento nasce com status DRAFT.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateEventInput'
            responses:
                '201':
                    description: Evento criado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Event'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
    /events/{id}:
        get:
            tags: [Eventos]
            summary: Consulta um evento pelo identificador
            security: []
            parameters:
                - $ref: '#/components/parameters/EventId'
            responses:
                '200':
                    description: Evento encontrado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Event'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/EventNotFound'
        patch:
            tags: [Eventos]
            summary: Atualiza um evento
            description: Permitido ao organizador dono do evento ou ao ADMIN.
            parameters:
                - $ref: '#/components/parameters/EventId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateEventInput'
            responses:
                '200':
                    description: Evento atualizado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Event'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EventNotFound'
        delete:
            tags: [Eventos]
            summary: Remove um evento
            description: Permitido ao organizador dono do evento ou ao ADMIN.
            parameters:
                - $ref: '#/components/parameters/EventId'
            responses:
                '204':
                    description: Evento removido
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EventNotFound'
    /events/{id}/reservations:
        post:
            tags: [Reservas]
            summary: Reserva uma vaga no evento
            description: Restrito ao papel CUSTOMER.
            parameters:
                - $ref: '#/components/parameters/EventId'
            responses:
                '201':
                    description: Reserva criada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EventNotFound'
                '409':
                    description: Evento sem vagas ou reserva já existente para o usuário
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                semVagas:
                                    value:
                                        error:
                                            code: EVENT_CAPACITY_REACHED
                                            message: Evento sem vagas disponíveis
                                reservaDuplicada:
                                    value:
                                        error:
                                            code: RESOURCE_ALREADY_EXISTS
                                            message: Já existe um registro com os dados informados
        get:
            tags: [Reservas]
            summary: Lista as reservas de um evento
            description: Permitido ao organizador dono do evento ou ao ADMIN.
            parameters:
                - $ref: '#/components/parameters/EventId'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Página de reservas do evento
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, infos]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/ReservationWithUser'
                                    infos:
                                        $ref: '#/components/schemas/PaginationInfos'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EventNotFound'
    /reservations/me:
        get:
            tags: [Reservas]
            summary: Lista as reservas do usuário autenticado
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                '200':
                    description: Página de reservas do usuário
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, infos]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/ReservationWithEvent'
                                    infos:
                                        $ref: '#/components/schemas/PaginationInfos'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
    /reservations/{id}/cancel:
        patch:
            tags: [Reservas]
            summary: Cancela uma reserva
            description: Permitido ao dono da reserva ou ao ADMIN.
            parameters:
                - $ref: '#/components/parameters/ReservationId'
            responses:
                '200':
                    description: Reserva cancelada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Reserva não encontrada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error:
                                    code: RESERVATION_NOT_FOUND
                                    message: Reserva não encontrada
                '409':
                    description: Reserva já cancelada
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error:
                                    code: RESERVATION_ALREADY_CANCELLED
                                    message: Reserva já está cancelada
    /events/{id}/attachments:
        post:
            tags: [Anexos]
            summary: Envia um arquivo para o evento
            description: |
                Permitido ao organizador dono do evento ou ao ADMIN.
                Tamanho máximo de 5 MiB (5242880 bytes) e tipos aceitos:
                `image/jpeg`, `image/png`, `image/webp` e `application/pdf`.
            parameters:
                - $ref: '#/components/parameters/EventId'
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file]
                            properties:
                                file:
                                    type: string
                                    format: binary
            responses:
                '201':
                    description: Anexo registrado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Attachment'
                '400':
                    description: Arquivo ausente, tipo não permitido ou parâmetro inválido
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                arquivoAusente:
                                    value:
                                        error:
                                            code: FILE_REQUIRED
                                            message: Nenhum arquivo enviado no campo file
                                tipoInvalido:
                                    value:
                                        error:
                                            code: INVALID_FILE_TYPE
                                            message: 'Tipo de arquivo não permitido. Tipos aceitos: image/jpeg, image/png, image/webp, application/pdf'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/EventNotFound'
                '413':
                    description: Arquivo maior que o limite
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                error:
                                    code: FILE_TOO_LARGE
                                    message: Arquivo excede o tamanho máximo de 5242880 bytes
    /attachments/{id}/download:
        get:
            tags: [Anexos]
            summary: Baixa o arquivo de um anexo
            description: Devolve o arquivo com o nome original em `Content-Disposition`.
            parameters:
                - $ref: '#/components/parameters/AttachmentId'
            responses:
                '200':
                    description: Conteúdo do arquivo
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    description: Anexo ou arquivo armazenado não encontrado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                anexoInexistente:
                                    value:
                                        error:
                                            code: ATTACHMENT_NOT_FOUND
                                            message: Anexo não encontrado
                                arquivoInexistente:
                                    value:
                                        error:
                                            code: ATTACHMENT_FILE_NOT_FOUND
                                            message: Arquivo do anexo não encontrado
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    parameters:
        Page:
            name: page
            in: query
            description: Página desejada, começando em 1
            schema:
                type: integer
                minimum: 1
                default: 1
        Limit:
            name: limit
            in: query
            description: Quantidade de registros por página
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 10
        UserId:
            name: id
            in: path
            required: true
            description: Identificador do usuário
            schema:
                type: string
                format: uuid
        EventId:
            name: id
            in: path
            required: true
            description: Identificador do evento
            schema:
                type: string
                format: uuid
        ReservationId:
            name: id
            in: path
            required: true
            description: Identificador da reserva
            schema:
                type: string
                format: uuid
        AttachmentId:
            name: id
            in: path
            required: true
            description: Identificador do anexo
            schema:
                type: string
                format: uuid
    responses:
        ValidationError:
            description: Dados inválidos
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        error:
                            code: VALIDATION_ERROR
                            message: Dados inválidos
                            details:
                                - field: email
                                  message: E-mail inválido
        Unauthorized:
            description: Token ausente, inválido ou expirado
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    examples:
                        tokenAusente:
                            value:
                                error:
                                    code: UNAUTHORIZED
                                    message: Token de autenticação não informado
                        tokenInvalido:
                            value:
                                error:
                                    code: INVALID_TOKEN
                                    message: Token de autenticação inválido
                        tokenExpirado:
                            value:
                                error:
                                    code: TOKEN_EXPIRED
                                    message: Token de autenticação expirado
        Forbidden:
            description: Usuário sem permissão para a operação
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        error:
                            code: FORBIDDEN
                            message: Você não tem permissão para gerenciar este evento
        EventNotFound:
            description: Evento não encontrado
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
                    example:
                        error:
                            code: EVENT_NOT_FOUND
                            message: Evento não encontrado
    schemas:
        Error:
            type: object
            required: [error]
            properties:
                error:
                    type: object
                    required: [code, message]
                    properties:
                        code:
                            type: string
                            example: VALIDATION_ERROR
                        message:
                            type: string
                            example: Dados inválidos
                        details:
                            type: array
                            items:
                                type: object
                                required: [field, message]
                                properties:
                                    field:
                                        type: string
                                    message:
                                        type: string
        PaginationInfos:
            type: object
            required: [page, limit, total, totalPages]
            properties:
                page:
                    type: integer
                    example: 1
                limit:
                    type: integer
                    example: 10
                total:
                    type: integer
                    example: 4
                totalPages:
                    type: integer
                    example: 1
        UserRole:
            type: string
            enum: [ADMIN, ORGANIZER, CUSTOMER]
        EventStatus:
            type: string
            enum: [DRAFT, PUBLISHED, CANCELLED]
        ReservationStatus:
            type: string
            enum: [CONFIRMED, CANCELLED]
        User:
            type: object
            required: [id, name, email, role, createdAt, updatedAt]
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                    example: Cliente de Teste
                email:
                    type: string
                    format: email
                    example: cliente@gereve.dev
                role:
                    $ref: '#/components/schemas/UserRole'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        RegisterUserInput:
            type: object
            required: [name, email, password]
            properties:
                name:
                    type: string
                    minLength: 3
                    maxLength: 120
                    example: Cliente de Teste
                email:
                    type: string
                    format: email
                    example: cliente@gereve.dev
                password:
                    type: string
                    format: password
                    minLength: 8
                    maxLength: 72
                    example: senha-forte-123
        LoginUserInput:
            type: object
            required: [email, password]
            properties:
                email:
                    type: string
                    format: email
                    example: admin@gereve.dev
                password:
                    type: string
                    format: password
                    example: senha-forte-123
        LoginResult:
            type: object
            required: [token, user]
            properties:
                token:
                    type: string
                    description: Token JWT a ser enviado no cabeçalho Authorization
                user:
                    $ref: '#/components/schemas/User'
        UpdateUserRoleInput:
            type: object
            required: [role]
            properties:
                role:
                    $ref: '#/components/schemas/UserRole'
        Event:
            type: object
            required:
                [
                    id,
                    title,
                    description,
                    location,
                    startsAt,
                    endsAt,
                    capacity,
                    status,
                    organizerId,
                    createdAt,
                    updatedAt,
                ]
            properties:
                id:
                    type: string
                    format: uuid
                title:
                    type: string
                    example: Palestra de Node.js
                description:
                    type: string
                    example: Introdução prática a APIs com Express e Prisma
                location:
                    type: string
                    example: Laboratório de Informática 4, Bloco C
                startsAt:
                    type: string
                    format: date-time
                endsAt:
                    type: string
                    format: date-time
                capacity:
                    type: integer
                    example: 30
                status:
                    $ref: '#/components/schemas/EventStatus'
                organizerId:
                    type: string
                    format: uuid
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        CreateEventInput:
            type: object
            required: [title, description, location, startsAt, endsAt, capacity]
            properties:
                title:
                    type: string
                    minLength: 3
                    maxLength: 120
                    example: Palestra de Node.js
                description:
                    type: string
                    minLength: 10
                    maxLength: 2000
                    example: Introdução prática a APIs com Express e Prisma
                location:
                    type: string
                    minLength: 3
                    maxLength: 200
                    example: Laboratório de Informática 4, Bloco C
                startsAt:
                    type: string
                    format: date-time
                    description: ISO 8601 com fuso horário
                    example: '2026-10-01T18:00:00-03:00'
                endsAt:
                    type: string
                    format: date-time
                    description: ISO 8601 com fuso horário, posterior a startsAt
                    example: '2026-10-01T21:00:00-03:00'
                capacity:
                    type: integer
                    minimum: 1
                    example: 30
        UpdateEventInput:
            type: object
            minProperties: 1
            properties:
                title:
                    type: string
                    minLength: 3
                    maxLength: 120
                description:
                    type: string
                    minLength: 10
                    maxLength: 2000
                location:
                    type: string
                    minLength: 3
                    maxLength: 200
                startsAt:
                    type: string
                    format: date-time
                    example: '2026-10-01T18:00:00-03:00'
                endsAt:
                    type: string
                    format: date-time
                    example: '2026-10-01T21:00:00-03:00'
                capacity:
                    type: integer
                    minimum: 1
                status:
                    $ref: '#/components/schemas/EventStatus'
        Reservation:
            type: object
            required: [id, userId, eventId, status, createdAt]
            properties:
                id:
                    type: string
                    format: uuid
                userId:
                    type: string
                    format: uuid
                eventId:
                    type: string
                    format: uuid
                status:
                    $ref: '#/components/schemas/ReservationStatus'
                createdAt:
                    type: string
                    format: date-time
        ReservationWithUser:
            allOf:
                - $ref: '#/components/schemas/Reservation'
                - type: object
                  required: [user]
                  properties:
                      user:
                          type: object
                          required: [id, name, email]
                          properties:
                              id:
                                  type: string
                                  format: uuid
                              name:
                                  type: string
                              email:
                                  type: string
                                  format: email
        ReservationWithEvent:
            allOf:
                - $ref: '#/components/schemas/Reservation'
                - type: object
                  required: [event]
                  properties:
                      event:
                          $ref: '#/components/schemas/Event'
        Attachment:
            type: object
            required:
                [id, originalName, storedName, mimeType, size, eventId, uploadedById, createdAt]
            properties:
                id:
                    type: string
                    format: uuid
                originalName:
                    type: string
                    example: cartaz.png
                storedName:
                    type: string
                    example: 6f1c1c62-6a7f-4a0f-9a1e-0f1a2b3c4d5e.png
                mimeType:
                    type: string
                    example: image/png
                size:
                    type: integer
                    description: Tamanho em bytes
                    example: 204800
                eventId:
                    type: string
                    format: uuid
                uploadedById:
                    type: string
                    format: uuid
                createdAt:
                    type: string
                    format: date-time
security:
    - bearerAuth: []
