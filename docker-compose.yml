services:
    postgres:
        image: postgres:16-alpine
        container_name: gereve-postgres
        restart: unless-stopped
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: gereve
            POSTGRES_PASSWORD: gereve
            POSTGRES_DB: gereve
        volumes:
            - gereve-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U gereve -d gereve']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    gereve-pgdata:
